<!doctype html><html lang="en"><script src="/studios/bridge.js"></script><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Editor | ClipForge</title><style>
body{margin:0;background:#f3f5fa;color:#18273b;font:14px/1.6 "Segoe UI",Arial,sans-serif}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:23px;margin:0}p{margin:7px 0 15px}.notice{background:#e2ebe6;border-left:3px solid #3a7255;padding:12px;font-size:12px}section{background:white;border:1px solid #cbd5df;padding:20px;margin:18px 0;border-radius:6px}label{display:inline-block;margin:6px 12px 6px 0;font-size:12px}input,select,textarea,button{font:inherit;padding:9px;box-sizing:border-box}input[type=number]{width:115px}input,select,textarea{border:1px solid #a9bac6;border-radius:3px}button,.button{background:#FFFFFF;border:1px solid #235840;color:white;border-radius:3px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:12px;align-items:center;border-top:1px solid #dce2e8;padding:10px 0;flex-wrap:wrap}.row strong{min-width:55px}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.clip{border:1px solid #cbd5df;padding:12px}video{width:100%;max-height:330px;background:#FFFFFF}.error{color:#b3261e}.actions{display:flex;gap:9px;flex-wrap:wrap}textarea{width:100%}[hidden]{display:none!important}a:focus-visible,button:focus-visible{outline:3px solid #b98219;outline-offset:2px}
</style><link rel="stylesheet" href="/studios/light-theme.css?v=pricing-20261026-1"><script defer src="/studios/preview-modal.js"></script></head><body><main><h1>Video Editor</h1><p class="notice">Edit video, mix audio, and combine clips in one workspace. Use the timeline below to preview and export your finished video.</p>
<section><h2>Transcript & local assistant</h2><label>Video<input id="upload" type="file" accept="video/*"></label><label>or paste a YouTube / TikTok link<input id="source-link" type="url" placeholder="https://youtu.be/…" autocomplete="off"></label><button id="transcribe" disabled>Transcribe actual video</button><p id="status" role="status"></p><p id="error" class="error" role="alert"></p><textarea id="transcript" rows="6" placeholder="Actual local transcription appears here."></textarea><label>Question<input id="question" value="Summarize the key points." size="40"></label><button id="ask">Ask local Qwen</button><pre id="reply" style="white-space:pre-wrap"></pre></section><section><h2>Editing history</h2><button id="history">Refresh local history</button><div id="history-list"></div><p>Your account history is available in ClipForge Classic. This list shows your Studio editing history.</p></section></main><script type="module">
const $=id=>document.getElementById(id);let file=null,busy=false;
async function api(url,options){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
const ready=()=>{$('transcribe').disabled=busy||!(file||$('source-link').value.trim())};
async function run(label,action){busy=true;ready();$('status').textContent=label;$('error').textContent='';try{await action()}catch(e){$('error').textContent=e.message}finally{busy=false;ready()}}
$('upload').onchange=e=>{file=e.target.files[0]||null;if(file)$('source-link').value='';ready()};
$('source-link').oninput=()=>{if($('source-link').value.trim()){file=null;$('upload').value=''}ready()};
$('transcribe').onclick=()=>run('Transcribing actual audio...',async()=>{let d;if(file){const f=new FormData();f.append('file',file);d=await api('/api/videos',{method:'POST',body:f})}else d=await api('/api/videos/url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link:$('source-link').value.trim()})});$('transcript').value=d.text;$('status').textContent='Actual transcript ready.'});
$('ask').onclick=()=>run('Preparing transcript sections...',async()=>{const job=await api('/local-original/assistant-jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transcript:$('transcript').value,prompt:$('question').value})});let d;do{await new Promise(r=>setTimeout(r,1500));d=await api('/local-original/assistant-jobs/'+job.id);$('reply').textContent=d.stage}while(['queued','running'].includes(d.status));if(d.status==='failed')throw Error(d.error);$('reply').textContent=d.reply;$('status').textContent=d.engine+' - '+d.sections_analyzed+' sections analyzed'});
$('history').onclick=async()=>{const d=await api('/local-original/history');$('history-list').replaceChildren();for(const r of d.records){const p=document.createElement('p');p.textContent=r.source_name+' · '+r.items.length+' clips ';const a=document.createElement('a');a.href=r.zip_url;a.textContent='Download batch';p.append(a);$('history-list').append(p)}};
</script><script type="module" src="/studios/editor-handoff.js"></script><script type="module" src="/studios/editor.js?v=visual-20261031-1"></script></body></html>
