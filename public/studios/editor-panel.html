<section id="image-video-panel"><h2>AI Video Generator</h2><div class="actions" role="tablist" aria-label="Video generation mode"><button id="iv-tab-text" role="tab" aria-selected="true">Text-to-Video</button><button id="iv-tab-image" role="tab" aria-selected="false">Image-to-Video</button></div><p id="iv-capability" role="status">Checking provider connection...</p><div id="iv-image-fields" hidden><label>Reference image<input id="iv-image" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="iv-reference" alt="Uploaded reference image" hidden style="max-width:240px;max-height:180px"></div><label id="iv-prompt-label">Video / motion prompt<textarea id="iv-prompt" rows="3" maxlength="2000" placeholder="Describe your video"></textarea></label><div class="actions"><label>KIE model<select id="iv-model"></select></label><label>Resolution<select id="iv-resolution"></select></label><label>Audio<select id="iv-audio"></select></label><label>Duration<select id="iv-duration"><option value="5">5 seconds</option><option value="10">10 seconds</option></select></label><label>Aspect ratio<select id="iv-ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></label><label id="iv-motion-field" hidden>Motion style<select id="iv-motion"><option>Cinematic</option><option>Natural movement</option><option>Camera zoom</option><option>Camera pan</option><option>Animated character</option><option>Custom prompt</option></select></label></div><p id="iv-model-details"></p><p id="iv-allowance" role="status"></p><p id="iv-cost" role="status"></p><p><a id="iv-pricing-source" target="_blank" rel="noopener noreferrer"></a></p><details><summary>Unavailable models and variants</summary><p id="iv-excluded" style="white-space:pre-line"></p></details><button id="iv-generate" disabled>Review cost &amp; generate video</button><p id="iv-status" role="status" aria-live="polite"></p><p id="iv-error" class="error" role="alert"></p><div id="iv-result" hidden><video id="iv-preview" controls></video><a id="iv-download" class="button" download="generated-video.mp4">Download MP4</a> <button id="iv-send">Send to Video Editor</button></div></section>
<section id="video-editor"><style>
#video-editor{--ve-line:#d6dde6;--ve-dark:#0f1720}
#video-editor .ve-import{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
#video-editor .ve-bin{display:flex;gap:10px;overflow-x:auto;padding:6px 0 10px}
#video-editor .ve-card{flex:0 0 190px;border:1px solid var(--ve-line);border-radius:8px;background:#fff;padding:8px;font-size:12px}
#video-editor .ve-card img,#video-editor .ve-card .ve-icon{width:100%;height:96px;object-fit:cover;border-radius:5px;background:var(--ve-dark);display:block}
#video-editor .ve-card .ve-icon{background:#3b2f63;color:#fff;display:grid;place-items:center;font-size:30px}
#video-editor .ve-card strong{display:block;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#video-editor .ve-card button{padding:4px 7px;margin:3px 3px 0 0;font-size:11px}
#video-editor .ve-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start;margin-top:8px}
#video-editor .ve-stage-box{background:var(--ve-dark);border-radius:8px;padding:10px;display:flex;justify-content:center}
#video-editor .ve-stage{position:relative;overflow:hidden;background:#000;touch-action:none}
#video-editor .ve-stage video,#video-editor .ve-stage .ve-still{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;background:#000}
#video-editor .ve-layer{position:absolute;inset:0;pointer-events:none}
#video-editor .ve-text{position:absolute;white-space:pre;background:rgba(0,0,0,.45);pointer-events:auto;cursor:move;user-select:none}
#video-editor .ve-ov{position:absolute;pointer-events:auto;cursor:move;user-select:none}
#video-editor .ve-ov img{display:block;width:100%;height:100%;pointer-events:none}
#video-editor .ve-picked{outline:2px dashed #fbbf24;outline-offset:2px}
#video-editor .ve-corner{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#fbbf24;border-radius:3px;cursor:nwse-resize}
#video-editor .ve-fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#video-editor .ve-empty{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0c3;font-size:14px;text-align:center;padding:20px}
#video-editor .ve-transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
#video-editor .ve-time{font:600 13px/1 ui-monospace,Consolas,monospace;min-width:130px}
#video-editor #ve-play{min-width:86px}
#video-editor .ve-inspector{border:1px solid var(--ve-line);border-radius:8px;padding:12px;background:#fff;font-size:13px}
#video-editor .ve-inspector h3{margin:0 0 8px;font-size:15px}
#video-editor .ve-inspector label{display:block;margin:8px 0}
#video-editor .ve-inspector input:not([type=checkbox]),#video-editor .ve-inspector select,#video-editor .ve-inspector textarea{width:100%}
#video-editor .ve-inspector input[type=color]{height:38px;padding:3px}
#video-editor .ve-inspector details{margin-top:10px;border-top:1px solid var(--ve-line);padding-top:6px}
#video-editor .ve-inspector details label{display:inline-block;width:46%;margin:4px 2% 4px 0}
#video-editor .ve-timeline{margin-top:12px;border:1px solid var(--ve-line);border-radius:8px;background:#f8fafc;display:grid;grid-template-columns:96px minmax(0,1fr);overflow:hidden;user-select:none}
#video-editor .ve-labels>div{height:var(--h);display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;border-bottom:1px solid var(--ve-line);background:#fff;box-sizing:border-box}
#video-editor .ve-scroll{overflow-x:auto;position:relative}
#video-editor .ve-content{position:relative}
#video-editor .ve-ruler{height:26px;position:relative;border-bottom:1px solid var(--ve-line);background:#fff;cursor:pointer;box-sizing:border-box}
#video-editor .ve-ruler span{position:absolute;top:4px;font-size:10px;color:#64748b;border-left:1px solid #cbd5e1;padding-left:3px;height:18px;pointer-events:none}
#video-editor .ve-row{position:relative;height:var(--h);border-bottom:1px solid var(--ve-line);box-sizing:border-box}
#video-editor .ve-item{position:absolute;top:4px;bottom:4px;border-radius:6px;overflow:hidden;cursor:grab;box-sizing:border-box;border:2px solid transparent;font-size:11px;color:#fff;display:flex;align-items:center}
#video-editor .ve-item.ve-sel{border-color:#fbbf24}
#video-editor .ve-name{position:relative;z-index:1;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none}
#video-editor .ve-strip{position:absolute;inset:0;display:flex;background:#1e293b;pointer-events:none}
#video-editor .ve-strip img{height:100%;flex:0 0 auto;object-fit:cover}
#video-editor .ve-strip+.ve-name{align-self:flex-end;padding-bottom:3px}
#video-editor .ve-h{position:absolute;top:0;bottom:0;width:9px;z-index:2;cursor:ew-resize;background:rgba(255,255,255,.6)}
#video-editor .ve-h.l{left:0}#video-editor .ve-h.r{right:0}
#video-editor .ve-kind-music{background:#7c3aed}#video-editor .ve-kind-effect{background:#db2777}#video-editor .ve-kind-text{background:#0f766e}#video-editor .ve-kind-overlay{background:#b45309}
#video-editor .ve-playhead{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:5;pointer-events:none}
#video-editor .ve-playhead::before{content:"";position:absolute;top:0;left:-7px;width:16px;height:14px;background:#ef4444;border-radius:3px 3px 8px 8px}
#video-editor .ve-drop{position:absolute;top:0;bottom:0;width:3px;background:#fbbf24;z-index:4;pointer-events:none}
#video-editor .ve-settings{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;margin-top:12px}
#video-editor .ve-settings input[type=number]{width:80px}
@media (max-width:820px){#video-editor .ve-main{grid-template-columns:1fr}#video-editor .ve-timeline{grid-template-columns:70px minmax(0,1fr)}}
</style>
